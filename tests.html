<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terra Shape Explorer – self tests</title>
<style>
:root{--bg:#f3f1ec;--panel:#fff;--ink:#1c1c1e;--muted:#6d6d72;--line:#dcd8d0;--ok:#2f6f5e;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#17181a;--panel:#212225;--ink:#ececee;--muted:#9a9aa0;--line:#35363a;--ok:#4fa58d;--bad:#ff6b5e}}
body{margin:0;padding:18px 16px 40px;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,Helvetica,Arial,sans-serif}
h1{font-size:18px;margin:0 0 4px}
p{margin:0 0 12px;color:var(--muted)}
#sum{font-weight:700;margin:10px 0}
#sum.ok{color:var(--ok)}#sum.bad{color:var(--bad)}
.t{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0 0 6px}
.t b{font-weight:600}.t .s{float:right;font-weight:700}
.t.ok .s{color:var(--ok)}.t.bad .s{color:var(--bad)}.t.bad{border-color:var(--bad)}
.t ul{margin:6px 0 0;padding-left:18px;color:var(--bad);font-size:12.5px}
.t small{color:var(--muted)}
button{font:inherit;padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
iframe{position:fixed;left:-3000px;top:0;border:0;visibility:hidden}
</style>
</head>
<body>
<h1>Terra Shape Explorer – self tests</h1>
<p>Opens the app in a hidden frame and drives it. Nothing here changes the app; your saved work in this browser is put back when the run ends.</p>
<button id="run">Run again</button>
<div id="sum">Running…</div>
<div id="out"></div>
<iframe id="app" width="1280" height="820"></iframe>
<script src="relay/room.js"></script>
<script>
'use strict';
/* Each test gets a fresh copy of the app (w = its window, E = run code inside it) and a check function ok(condition, message). */
const TESTS=[];const test=(name,fn,opt)=>TESTS.push({name,fn,opt:opt||{}});
// A pause that lets the app catch up. Browsers slow timers right down in a tab that is not on screen, so there the pause is a few turns of the message queue instead.
const tick=()=>new Promise(r=>{const c=new MessageChannel();c.port1.onmessage=()=>r();c.port2.postMessage(0);});
const sleep=async ms=>{if(!document.hidden)return new Promise(r=>setTimeout(r,ms));for(let i=0;i<6;i++)await tick();};
const LIBS=['Kocho','Aurum','Ditto','GFN','Gyro','Nemus','R26','Prefect','P1','Jon Rogers','LBB'];

function helpers(w){
 const E=c=>w.eval(c);
 const cv=w.document.querySelector('#cv');
 const ev=(t,x,y,o)=>{const r=cv.getBoundingClientRect();cv.dispatchEvent(new w.PointerEvent(t,Object.assign({bubbles:true,clientX:r.left+x,clientY:r.top+y,pointerId:1,pointerType:'mouse'},o||{})));};
 const drag=(a,b,n=5)=>{ev('pointerdown',a[0],a[1]);for(let i=1;i<=n;i++)ev('pointermove',a[0]+(b[0]-a[0])*i/n,a[1]+(b[1]-a[1])*i/n);ev('pointerup',b[0],b[1]);};
 const click=p=>{ev('pointerdown',p[0],p[1]);ev('pointerup',p[0],p[1]);};
 const PP=q=>E(`[sx(VT.design,${q[0]}),sy(VT.design,${q[1]})]`);          // world mm -> canvas px
 const finite=()=>E(`(()=>{const G=CUR.G,A=CUR.A;return G.kenPts.every(q=>isFinite(q[0])&&isFinite(q[1])&&q[1]>=0)&&G.sarPts.every(q=>isFinite(q[0])&&isFinite(q[1])&&q[1]>0)&&[A.kM,A.sM,A.M,A.tM,A.cog.x,A.cog.y].every(isFinite)&&A.kM>0&&A.sM>0;})()`);
 const fitView=()=>E(`VT.design.auto=true;render();`);
 return{E,cv,ev,drag,click,PP,finite,fitView};
}

/* ---------- start-up ---------- */
test('App starts in Drag & draw with no errors',async({w,E,ok})=>{
 ok(E('typeof LIB')==='object'&&E('LIB.length')===11,'library has 11 shapes');
 ok(E('S.mode')==='dd','opens in Drag & draw');
 ok(w.document.querySelector('#lView b').textContent==='Drag & draw','View pill reads Drag & draw');
 ok(w.document.querySelector('#lTama b').textContent==='Free','Tama pill reads Free');
 const D=w.document,secs=[...D.querySelectorAll('#params>details.top')];
 ok(secs.map(d=>d.id).join()==='topMan,topDD','Manual control is above the tool info');
 ok(D.querySelector('#topDD>summary').textContent==='Drag & draw tool info','the tool info section is named');
 ok(secs.every(d=>!d.open),'both sections start folded');
 ok(D.body.classList.contains('l-shut')&&w.getComputedStyle(D.querySelector('aside.left')).display==='none','the left menu starts folded away');
 D.querySelector('#bLeft').click();ok(w.getComputedStyle(D.querySelector('aside.left')).display!=='none','the Menu button opens it');
 D.querySelector('#topMan>summary').click();ok(D.querySelector('#topMan').open&&E('S.mode')==='dd','opening Manual control keeps Drag & draw');
 D.querySelector('#bLeft').click();ok(D.body.classList.contains('l-shut'),'and closes it again');
 const views=[...D.querySelectorAll('#tView option')].map(o=>o.value).join();ok(views==='dd,spec,compare','the View menu offers Drag & draw, Spec sheet and Compare ('+views+')');
 ok(!/jarod|porter/i.test(w.document.documentElement.innerHTML),'no Jarod / Porter text');
});

/* ---------- every library shape ---------- */
for(const name of LIBS)test(`Library shape loads, draws and exports: ${name}`,async({w,E,ok,finite})=>{
 E(`loadLib(${JSON.stringify(name)})`);await sleep(30);
 ok(E('S.meta.model')===name.toUpperCase()||E('S.meta.model')===name,'shape name filled in');
 ok(finite(),'outline and balance numbers are all finite');
 ok(E('S.p.swoopMode')==='one','opens as one swoop surface');
 ok(!Object.keys(E('S.curves')).some(k=>k==='smCup'||k==='bgCup'),'cups are a single radius (no traced cup curves)');
 for(const v of['design','spec','compare'])E(`setView('${v}');render();`);
 E(`S.page=2;render();S.page=1;setView('design');`);
 const pdf=E(`(()=>{const a=new PdfDrawer(612),b=new PdfDrawer(612);specPage1(a,CUR);specPage2(b,CUR);const d=buildPdf([a.o,b.o],792,612);return typeof d==='string'?d.length:(d.byteLength||d.length||0);})()`);
 ok(pdf>2000,'PDF builds ('+pdf+' bytes)');
 const got=E(`(()=>{const o=[],keep=download;download=(n,d)=>o.push([n,(d&&d.length)||0]);try{exportDxf();}finally{download=keep;}return o;})()`);
 ok(got.length===1&&/\.dxf$/i.test(got[0][0])&&got[0][1]>1000,'DXF exports');
 for(const part of['ken','sarado']){const n=E(`(()=>{$('#gPart').value='${part}';gStockDefault();const t=gcode();return t?t.length:0;})()`);ok(n>200,'G-code builds for the '+part);}
 for(const m of[['two',''],['one','radius'],['one','mirror']]){E(`S.p.swoopMode='${m[0]}';${m[1]?`S.p.swAMode='${m[1]}';`:''}refresh();`);ok(finite(),'swoop mode '+m.join(' ')+' builds');}
 E(`setLook('3d');render();`);ok(E('M3&&M3.q.length')>500,'3D model builds');E(`setLook('fill');`);
});

test('Tour: every step points at something, the shape stays editable, nothing is kept, ends on the start screen',async({w,E,ok,cv})=>{
 const D=w.document,T=D.querySelector('#tour');E(`localStorage.removeItem('ksd.autosave');`);
 E(`tourStart(false)`);await sleep(80);
 ok(E('TOUR.on')&&T.classList.contains('wel'),'opens on Welcome');
 ok(E('TOUR.steps.map(s=>s.id).join()')==='welcome,start,pick,point,shape,move,more,pills,left,right,top,end','the steps, in order, no session step');
 ok(w.getComputedStyle(T).pointerEvents==='auto','Welcome takes a click');
 T.dispatchEvent(new w.MouseEvent('click',{bubbles:true}));await sleep(40);
 ok(E('TOUR.i')===1&&D.querySelector('#start').classList.contains('show'),'click moves on to the start screen step');
 const o=D.querySelector('#sOpen').getBoundingClientRect(),hit=D.elementFromPoint(o.left+o.width/2,o.top+o.height/2);
 ok(!D.querySelector('#sOpen').contains(hit),'start screen: only Randomize can be clicked');
 ok(D.querySelectorAll('#tour .tl').length===1,'start screen: one note');
 const p0=E('JSON.stringify(S.p)');D.querySelector('#start [data-t=random]').click();await sleep(40);
 ok(E('TOUR.i')===2&&E('JSON.stringify(S.p)')!==p0&&!D.querySelector('#start').classList.contains('show'),'Randomize makes a shape and moves the tour on');
 ok(E('TOUR.steps[TOUR.i].id')==='pick',"after Randomize: the dark Points step");E(`setDDTool('pan')`);D.querySelector('#dd button[data-d=point]').click();await sleep(30);
 ok(E('TOUR.steps[TOUR.i].id')==='point'&&E('DD.tool')==='point','clicking Points moves on to the points step');
 for(let i=3;i<11;i++){
  await sleep(40);const id=E('TOUR.steps[TOUR.i].id'),n=D.querySelectorAll('#tour .tl').length,want=E('TOUR.steps[TOUR.i].notes.length');
  ok(n===want,`${id}: ${n} of ${want} notes shown`);
  ok(w.getComputedStyle(T).pointerEvents==='none','dark layer lets clicks through on '+id);
  if(id==='point'){ok(E('DD.tool')==='point'&&E('!!tourPoint()'),'points step picks a point on screen');
   const r=cv.getBoundingClientRect(),e=D.elementFromPoint(r.left+r.width/2,r.top+r.height/3);ok(e===cv,'the drawing gets the pointer');
   E(`S.p.bigCupD=S.p.bigCupD+2;sanitize(S.p);refresh();commit();`);}
  if(id==='pills'){E(`setMode('manual');setView('spec')`);await sleep(30);E('tourLay()');ok(D.querySelector('#tour .tl.warn'),'off Drag & draw: asked to go back');E(`setMode('dd')`);await sleep(30);E('tourLay()');ok(!D.querySelector('#tour .tl.warn'),'back in Drag & draw: no prompt');}
  if(id==='left')ok(E(`$('#topMan').open&&!document.body.classList.contains('l-shut')`),'left menu open with Manual control open');
  w.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));
 }
 await sleep(40);ok(E('TOUR.steps[TOUR.i].id')==='end'&&T.classList.contains('fin'),'ends on the End Tutorial screen');
 ok(D.querySelector('#tour .tlogo path').getAttribute('d').length>100&&D.querySelector('#tour .tlogo').getBoundingClientRect().height>40,'leaf logo shown on the end screen');
 D.querySelector('#tour .te').click();await sleep(40);
 ok(!E('TOUR.on')&&!T.classList.contains('show'),'End Tutorial closes the tour');
 ok(D.querySelector('#start').classList.contains('show'),'back on the start screen');
 ok(E(`localStorage.getItem('ksd.autosave')`)==null,'nothing autosaved during the tour');
 ok(E('MK.items.length')===0&&D.body.classList.contains('l-shut'),'mark-up cleared, left menu put back');
 E(`tourStart(false)`);await sleep(30);w.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await sleep(20);
 ok(!E('TOUR.on'),'Esc leaves the tour');
});
test('Tour from an invite: shared session step, ends back on the join window; all text has Japanese',async({w,E,ok})=>{
 const D=w.document;E(`COL.invite={room:'abcdefgh12',key:'abcdefgh12'};colShow('#colJoin');`);
 D.querySelector('#cjTour').click();await sleep(60);
 ok(E('TOUR.on')&&E('TOUR.guest')&&!D.querySelector('#colJoin').classList.contains('show'),'starts from the join window');
 ok(E('TOUR.steps.length')===13&&E('TOUR.steps.at(-2).id')==='col','thirteen steps, the session one before the end');
 E(`setLang('ja');`);
 for(let i=0;i<11;i++){await sleep(20);E('tourGo(1)');}
 await sleep(30);ok(E('TOUR.steps[TOUR.i].id')==='col'&&D.querySelectorAll('#tour .tl').length===2,'session step shows both notes');
 const strs=E(`[...TOUR_STEPS.flatMap(s=>[s.t,...(s.x||[]),...(s.notes||[]).flatMap(n=>n.t.flatMap(x=>x.split(String.fromCharCode(10))))]),'learn how','Next','Back','Skip tour','Click anywhere to start','End Tutorial','Enjoy','Go back to Drag & draw to continue'].filter(Boolean).filter(s=>JA[s]==null)`);
 ok(strs.length===0,'missing Japanese: '+strs.join(' | '));
 E(`tourGo(1)`);await sleep(20);E(`tourGo(1)`);await sleep(30);
 ok(!E('TOUR.on')&&D.querySelector('#colJoin').classList.contains('show')&&!D.querySelector('#start').classList.contains('show'),'ends on the join window');
 E(`setLang('en')`);
});
test('Tour on a phone: panels open from the bottom bar, every note shows, the card stays on screen',async({w,E,ok})=>{
 const D=w.document;E(`tourStart(false)`);await sleep(60);
 for(let i=1;i<E('TOUR.steps.length')-1;i++){E('tourGo(1)');await sleep(40);E('tourLay()');
  const id=E('TOUR.steps[TOUR.i].id'),n=D.querySelectorAll('#tour .tl').length,want=E('TOUR.steps[TOUR.i].notes.length'),c=D.querySelector('#tour .tc').getBoundingClientRect();
  ok(n===want,`${id}: ${n} of ${want} notes`);ok(c.left>=0&&c.right<=w.innerWidth&&c.top>=0&&c.bottom<=w.innerHeight,id+': card on screen');
  for(const l of D.querySelectorAll('#tour .tl')){const r=l.getBoundingClientRect();if(r.left<0||r.right>w.innerWidth)ok(false,id+': note off screen');}
  if(id==='left')ok(D.body.classList.contains('m-params'),'left menu step opens Fine Tune');
  if(id==='right')ok(D.body.classList.contains('m-bal'),'side panel step opens Side Bar');}
 E('tourGo(1)');E('tourEnd()');await sleep(30);ok(D.body.classList.contains('m-view'),'back to Design after the tour');
},{width:375,height:812});
test('LBB (V2 STEP files) matches the CAD measures',async({E,ok})=>{
 E(`loadLib('LBB')`);await sleep(30);
 const r=E(`(()=>{const G=CUR.G,p=S.p,K=LIB.find(q=>q.name==='LBB').exact.ken;const dv=(id,t)=>{let m=0;for(const[a,v]of G.segs[id].out)if(a<t)m=Math.max(m,Math.abs(v-interp(K,a)));return m;};const m=dv('swoopRing',99),mh=dv('ringHandle',91);
  return{kenH:p.kenH,spikeD:p.spikeD,sarL:p.sarL,yA:G.yA,smDepth:p.smDepth,bgDepth:p.bgDepth,baseDepth:p.baseDepth,rim:p.rim,tamaD:p.tamaD,hole:p.tamaHoleD,cs:p.tamaCsD,kenStr:p.kenStr,dev:m,devH:mh};})()`);
 ok(Math.abs(r.kenH-176.1)<0.01&&Math.abs(r.spikeD-10.92)<0.01,`ken 176.1 long, spike Ø10.92 (got ${r.kenH} / ${r.spikeD})`);
 ok(Math.abs(r.sarL-77.25)<0.01&&Math.abs(r.yA-118.085)<0.01,`sarado 77.25 long, its axis 118.09 up the ken (got ${r.sarL} / ${r.yA.toFixed(3)})`);
 ok(r.smDepth===7.55&&r.bgDepth===9.82&&r.baseDepth===6.5&&r.rim===1.1,'cup depths 7.55 / 9.82 / 6.5, rim 1.1');
 ok(r.tamaD===65.85&&r.hole===14.29&&r.cs===22&&r.kenStr===46,'tama Ø65.85, 9/16" hole, bevel Ø22.0, ken string hole 46 below the bevel');
 ok(r.dev<0.1,`swoop under the ring within ${r.dev.toFixed(3)} mm of the CAD`);
 ok(r.devH<0.55,`handle within ${r.devH.toFixed(3)} mm of the CAD (it blends into the locked taper, which is up to 1.09 mm Ø fuller than the CAD spike)`);
});

test('Compare view: leaf logo outline',async({E,ok,finite})=>{
 E(`loadLib('Kocho');S.cmpv=[];setView('compare');render();`);await sleep(30);
 const opt=E(`(()=>{const o=[...$('#tCmpAdd').options].find(x=>x.textContent==='leaf logo');return o?o.value:null;})()`);
 ok(!!opt,'Add a shape lists "leaf logo"');
 E(`(()=>{const s=$('#tCmpAdd');s.value=${JSON.stringify(opt||'')};s.onchange({target:s});})()`);await sleep(20);
 const r=E(`(()=>{const o=S.cmpv[0],P=ovPolys(o),ys=P.loops.flat().map(q=>q[1]);return{n:S.cmpv.length,shape:o.shape,loops:P.loops.length,h:Math.max(...ys)-Math.min(...ys),rows:document.querySelectorAll('#cmpPanel tr').length};})()`);
 ok(r.n===1&&r.shape==='leaf'&&r.loops===2,'added as an outline: the leaf and the t cutout');
 ok(Math.abs(r.h-160)<0.01,`160 mm tall (got ${r.h.toFixed(2)})`);
 ok(r.rows===2,'no balance row for an outline (it has no weight)');
 ok(finite(),'outline and balance numbers are all finite');
 const pd=E('JSON.stringify(projectData())');E(`S.cmpv=[];loadProject(JSON.parse(${JSON.stringify(pd)}));setView('compare');render();`);await sleep(20);
 ok(E(`S.cmpv.length===1&&S.cmpv[0].shape==='leaf'`),'kept when the project is saved and opened');
 E(`setView('design');setMode('dd');setDDTool('cmp');DD.ovAdd=true;syncDD();`);await sleep(20);
 const b=E(`(()=>{S.ovl=[];syncDD();const b=[...document.querySelectorAll('#dd .dd-list button')].find(x=>x.textContent==='leaf logo');if(b)b.click();return!!b;})()`);await sleep(20);
 ok(b,"Drag & draw's Compare tool lists it too");
 ok(E(`S.ovl.length===1&&S.ovl[0].shape==='leaf'&&S.cmpv.length===1`),'adding it there goes to Drag & draw\'s own list only');
 const lab=v=>E(`(()=>{const P=CanvasRenderingContext2D.prototype,f=P.fillText,seen=[];P.fillText=function(t,...a){seen.push(String(t));return f.call(this,t,...a);};try{${v};render();}finally{P.fillText=f;}return seen.includes('leaf logo');})()`);
 ok(!lab(''),'no "leaf logo" label is drawn in Drag & draw');
 ok(!lab(`setView('compare')`),'no "leaf logo" label is drawn in the Compare view');
 E(`setView('design')`);
 ok(finite(),'numbers stay finite with the outline in Drag & draw');
 E(`DD.ovAdd=false;S.ovl=[];S.cmpv=[];render();`);
});

test('Bird ridge steps drawn in the CAD are kept in the one-swoop view',async({E,ok})=>{
 E(`loadLib('P1')`);await sleep(30);
 const r=E(`(()=>{const G=CUR.G,o=G.p.sarL/2,e=LIB.find(q=>q.name==='P1'),at=u=>{let b=null;for(const q of G.sarPts){const d=Math.abs(q[0]+o-u);if(!b||d<b.d)b={d,r:q[1]};}return b.r;};
  let m=0;for(const[s,v]of G.sarPts){const u=s+o;if(Math.abs(u-11.67)<0.1||Math.abs(u-63.35)<0.1)continue;m=Math.max(m,Math.abs(v-interp(e.exact.sar,u)));}
  return{mode:S.p.swoopMode,sm:S.p.smStepH,bg:S.p.bgStepH,R:G.swoopR[0],smFoot:at(11.75),bgFoot:at(63.3),dev:m};})()`);
 ok(r.mode==='one','opens as one swoop surface');
 ok(Math.abs(r.sm-3.01)<0.05&&Math.abs(r.bg-3.24)<0.05,`steps found: small ${r.sm}, big ${r.bg} mm (drawing 2.99 / 3.24)`);
 ok(r.smFoot<21&&r.bgFoot<21.9,`swoop starts at the foot of each step (r ${r.smFoot.toFixed(2)} / ${r.bgFoot.toFixed(2)})`);
 ok(Math.abs(r.R-34.26)<0.1,`one swoop radius R${r.R.toFixed(2)} matches the drawing's R34.26`);
 ok(r.dev<0.05,`sarado outline within ${r.dev.toFixed(3)} mm of the CAD outline`);
 const none=E(`LIB.filter(e=>e.name!=='P1').filter(e=>{const p=libDesign(e).p;return p.smStepH>0.01||p.bgStepH>0.01;}).map(e=>e.name)`);
 ok(none.length===0,'shapes with rounded ridges get no step'+(none.length?': '+none.join(', '):''));
});

test('Spec sheet: cup depths as labels, contour types not values, no ADDED / LOCKED',async({E,ok})=>{
 E(`loadLib('Kocho');setView('spec');`);await sleep(30);
 const txt=pg=>E(`(()=>{const T=[];const D={style(){},line(){},poly(){},fill(){},hatch(){},tw:s=>String(s).length*3.5,text:s=>T.push(s)};withPrim(()=>(${pg})(D,CUR));return T;})()`);
 let p1=txt('specPage1'),p2=txt('specPage2');
 ok(p1.some(t=>/^SMALL CUP DEPTH /.test(t))&&p1.some(t=>/^BIG CUP DEPTH /.test(t))&&p1.some(t=>/^BOTTOM CUP DEPTH /.test(t)),'page 1 names each cup depth');
 ok(!p1.some(t=>/^RIM |IMPORTED|HAND-DRAWN|^TIP |SARADO-FIT|SWOOP|BASE CUP HOLE|, R\d/.test(t)),'page 1 drops the rim, contour, tip, taper and hole notes');
 ok(!p2.some(t=>t==='ADDED'||t==='LOCKED'),'page 2 has no ADDED / LOCKED tags');
 ok(!p2.some(t=>/ellipse|radius$|rounding|density|Contours|CoG above tama|small cup: spike|Swoop diameter|waist length|step height$/i.test(t)&&!/^Spike tip radius$|bird ridge step height$|^Radius$|^Balance figures/.test(t)),'page 2 leaves out the contour values and removed rows');
 const i=p2.indexOf('Swoop Ø at handle stall step');ok(i>0&&Math.abs(+p2[i+1]-(E('CUR.G.p.baseBandD')-2*E('CUR.G.p.hsStepH')))<0.051,'page 2 gives the swoop Ø where the handle stall step starts');
 ok(p2.filter(t=>/^-?\d+\.\d+$/.test(t)).every(t=>/\.\d$/.test(t)||['0.25','0.76'].includes(t))&&p1.filter(t=>/^-?\d+\.\d+$/.test(t)).every(t=>/\.\d$/.test(t)),'measures read to 0.1 mm; only the tolerances keep two decimals');
 ok(E(`fmtV(PD.smD,10.64)`)==='10.6'&&E(`fmtV(PD.tol,0.25)`)==='0.25','the measures panel shows 0.1 mm, tolerances 0.01');
 E(`S.p.smRidgeMode='radius';S.p.bgRidgeMode='ellipse';refresh();`);await sleep(20);p2=txt('specPage2');
 const v=l=>p2[p2.indexOf(l)+1];
 ok(v('Small bird ridge profile')==='Curved'&&v('Big bird ridge profile')==='Curved'&&v('Handle stall profile')==='Flat','ridges show Flat / Curved, no radius or ellipse values');
 E(`withPrim(()=>{CUR.G.segs.baseRidge.drawn=true;})`);p2=txt('specPage2');E('refresh()');
 ok(p2[p2.indexOf('Handle stall profile')+1]==='Hand drawn','a hand-drawn ridge says Hand drawn');
});

test('Points box: new point names, measure names, handle stall step as a ken Ø, sarado width on its own',async({w,E,ok})=>{
 E(`loadLib('Kocho');setMode('dd');setDDTool('point');`);await sleep(30);
 const box=id=>E(`(()=>{DD.selH='${id}';syncDD();return[...document.querySelectorAll('#dd .dd-n')].map(x=>x.textContent).concat([...document.querySelectorAll('#dd .dd-st')].map(x=>x.textContent));})()`);

/* ---------- shared sessions (Collaborate) ---------- */
// A pretend network: each app frame talks to one in-page room (relay/room.js, the same rules the real relay runs). Messages arrive a moment later, in order.
function fakeNet(room){return()=>{const ws={readyState:0,onopen:null,onmessage:null,onclose:null};let h=null,open=true;
 const conn={send:s=>queueMicrotask(()=>{if(open&&ws.onmessage)ws.onmessage({data:s});}),close:()=>queueMicrotask(()=>{if(!open)return;open=false;ws.readyState=3;if(h)h.close();if(ws.onclose)ws.onclose();})};
 ws.send=s=>{if(open)queueMicrotask(()=>h&&h.message(s));};ws.close=()=>conn.close();
 queueMicrotask(()=>{h=room.open(conn);ws.readyState=1;if(ws.onopen)ws.onopen();});return ws;};}
const extraFrames=[],extraErr=[];
function loadExtra(hash){return new Promise((res,rej)=>{const f=document.createElement('iframe');f.width=1280;f.height=820;document.body.append(f);extraFrames.push(f);const t=setTimeout(()=>rej(new Error('second app did not load')),15000);f.onload=()=>{clearTimeout(t);f.contentWindow.addEventListener('error',e=>extraErr.push(e.message));res(f.contentWindow);};f.src='index.html?selftest='+Date.now()+Math.random().toString(36).slice(2,5)+(hash||'');});}
const settle=async(...ws)=>{for(let i=0;i<3;i++){for(const w of ws)w.eval('colTick()');await sleep(30);}};

/* ---------- runner ---------- */
const frame=document.getElementById('app'),out=document.getElementById('out'),sum=document.getElementById('sum');
function loadApp(width,height){return new Promise((res,rej)=>{frame.width=width||1280;frame.height=height||820;const t=setTimeout(()=>rej(new Error('app did not load')),15000);frame.onload=()=>{clearTimeout(t);res(frame.contentWindow);};frame.src='index.html?selftest='+Date.now();});}
async function runAll(){
 // the app's password: every test opens it as a device that has already typed it
 let GH='';try{const m=(await (await fetch('index.html?fresh='+Date.now())).text()).match(/const GATE=\{hash:'([0-9a-f]*)'/);GH=m?m[1]:'';}catch(e){}
 out.innerHTML='';sum.className='';sum.textContent='Running…';
 const saved={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);saved[k]=localStorage.getItem(k);}}catch(e){}
 // tests.html?only=tama|stall runs just the tests whose names match; ?skip=every%20contour leaves those out
 const qs=new URLSearchParams(location.search),only=qs.get('only')&&new RegExp(qs.get('only'),'i'),skip=qs.get('skip')&&new RegExp(qs.get('skip'),'i'),LIST=TESTS.filter(T=>(!only||only.test(T.name))&&!(skip&&skip.test(T.name)));
 let pass=0,fail=0;const t0=performance.now();
 for(const T of LIST){
  const row=document.createElement('div');row.className='t';row.innerHTML='<span class="s">…</span><b></b>';row.querySelector('b').textContent=T.name;out.append(row);
  const fails=[];let checks=0;const errs=[];const s0=performance.now();
  try{
   try{localStorage.removeItem('ksd.autosave');localStorage.removeItem('tse.rs');localStorage.removeItem('tse.colName');localStorage.removeItem('tse.look');if(GH)localStorage.setItem('tse.gate',GH);else localStorage.removeItem('tse.gate');localStorage.setItem('tse.lang','en');localStorage.setItem('tse.right','1');sessionStorage.removeItem('tse.colSess');sessionStorage.removeItem('tse.colId');}catch(e){}
   const w=await loadApp(T.opt.width,T.opt.height);w.addEventListener('error',e=>errs.push(e.message));await sleep(60);
   const ok=(c,m)=>{checks++;if(!c)fails.push(m);};
   await T.fn(Object.assign({w,ok},helpers(w)));await sleep(20);
  }catch(e){fails.push('threw: '+(e&&e.message||e));}
  for(const f of extraFrames.splice(0))f.remove();
  for(const e of extraErr.splice(0))fails.push('error in a second app: '+e);
  for(const e of errs)fails.push('error in the app: '+e);
  const good=!fails.length;good?pass++:fail++;row.className='t '+(good?'ok':'bad');row.querySelector('.s').textContent=good?'pass':'FAIL';
  const sm=document.createElement('small');sm.textContent=`  ${checks} checks, ${Math.round(performance.now()-s0)} ms`;row.append(sm);
  if(!good){const ul=document.createElement('ul');for(const f of fails.slice(0,12)){const li=document.createElement('li');li.textContent=f;ul.append(li);}row.append(ul);}
  sum.textContent=`Running… ${pass+fail} / ${LIST.length}`;
 }
 try{localStorage.clear();for(const k in saved)localStorage.setItem(k,saved[k]);}catch(e){}
 frame.src='about:blank';
 sum.className=fail?'bad':'ok';sum.textContent=`${pass} passed, ${fail} failed, in ${((performance.now()-t0)/1000).toFixed(1)} s`+(LIST.length<TESTS.length?` (${TESTS.length-LIST.length} of ${TESTS.length} tests left out by the filter)`:'');
 window.RESULT={pass,fail,total:LIST.length,failed:[...out.querySelectorAll('.t.bad')].map(r=>r.innerText)};
}
document.getElementById('run').onclick=runAll;runAll();
</script>
