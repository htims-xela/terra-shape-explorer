<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terra Shape Explorer – self tests</title>
<style>
:root{--bg:#f3f1ec;--panel:#fff;--ink:#1c1c1e;--muted:#6d6d72;--line:#dcd8d0;--ok:#2f6f5e;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#17181a;--panel:#212225;--ink:#ececee;--muted:#9a9aa0;--line:#35363a;--ok:#4fa58d;--bad:#ff6b5e}}
body{margin:0;padding:18px 16px 40px;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,Helvetica,Arial,sans-serif}
h1{font-size:18px;margin:0 0 4px}
p{margin:0 0 12px;color:var(--muted)}
#sum{font-weight:700;margin:10px 0}
#sum.ok{color:var(--ok)}#sum.bad{color:var(--bad)}
.t{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0 0 6px}
.t b{font-weight:600}.t .s{float:right;font-weight:700}
.t.ok .s{color:var(--ok)}.t.bad .s{color:var(--bad)}.t.bad{border-color:var(--bad)}
.t ul{margin:6px 0 0;padding-left:18px;color:var(--bad);font-size:12.5px}
.t small{color:var(--muted)}
button{font:inherit;padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
iframe{position:fixed;left:-3000px;top:0;border:0;visibility:hidden}
</style>
</head>
<body>
<h1>Terra Shape Explorer – self tests</h1>
<p>Opens the app in a hidden frame and drives it. Nothing here changes the app; your saved work in this browser is put back when the run ends.</p>
<button id="run">Run again</button>
<div id="sum">Running…</div>
<div id="out"></div>
<iframe id="app" width="1280" height="820"></iframe>
<script>
'use strict';
/* Each test gets a fresh copy of the app (w = its window, E = run code inside it) and a check function ok(condition, message). */
const TESTS=[];const test=(name,fn,opt)=>TESTS.push({name,fn,opt:opt||{}});
// A pause that lets the app catch up. Browsers slow timers right down in a tab that is not on screen, so there the pause is a few turns of the message queue instead.
const tick=()=>new Promise(r=>{const c=new MessageChannel();c.port1.onmessage=()=>r();c.port2.postMessage(0);});
const sleep=async ms=>{if(!document.hidden)return new Promise(r=>setTimeout(r,ms));for(let i=0;i<6;i++)await tick();};
const LIBS=['Kocho','Aurum','Ditto','GFN','Gyro','Nemus','ROD26','Prefect','P1','Jon Rogers'];

function helpers(w){
 const E=c=>w.eval(c);
 const cv=w.document.querySelector('#cv');
 const ev=(t,x,y,o)=>{const r=cv.getBoundingClientRect();cv.dispatchEvent(new w.PointerEvent(t,Object.assign({bubbles:true,clientX:r.left+x,clientY:r.top+y,pointerId:1,pointerType:'mouse'},o||{})));};
 const drag=(a,b,n=5)=>{ev('pointerdown',a[0],a[1]);for(let i=1;i<=n;i++)ev('pointermove',a[0]+(b[0]-a[0])*i/n,a[1]+(b[1]-a[1])*i/n);ev('pointerup',b[0],b[1]);};
 const click=p=>{ev('pointerdown',p[0],p[1]);ev('pointerup',p[0],p[1]);};
 const PP=q=>E(`[sx(VT.design,${q[0]}),sy(VT.design,${q[1]})]`);          // world mm -> canvas px
 const finite=()=>E(`(()=>{const G=CUR.G,A=CUR.A;return G.kenPts.every(q=>isFinite(q[0])&&isFinite(q[1])&&q[1]>=0)&&G.sarPts.every(q=>isFinite(q[0])&&isFinite(q[1])&&q[1]>0)&&[A.kM,A.sM,A.M,A.tM,A.cog.x,A.cog.y].every(isFinite)&&A.kM>0&&A.sM>0;})()`);
 const fitView=()=>E(`VT.design.auto=true;render();`);
 return{E,cv,ev,drag,click,PP,finite,fitView};
}

/* ---------- start-up ---------- */
test('App starts in Drag & draw with no errors',async({w,E,ok})=>{
 ok(E('typeof LIB')==='object'&&E('LIB.length')===10,'library has 10 shapes');
 ok(E('S.mode')==='dd','opens in Drag & draw');
 ok(w.document.querySelector('#lView b').textContent==='Drag & draw','View pill reads Drag & draw');
 ok(w.document.querySelector('#lTama b').textContent==='Free','Tama pill reads Free');
 const D=w.document,secs=[...D.querySelectorAll('#params>details.top')];
 ok(secs.map(d=>d.id).join()==='topMan,topDD','Manual control is above the tool info');
 ok(D.querySelector('#topDD>summary').textContent==='Drag & draw tool info','the tool info section is named');
 ok(secs.every(d=>!d.open),'both sections start folded');
 ok(D.body.classList.contains('l-shut')&&w.getComputedStyle(D.querySelector('aside.left')).display==='none','the left menu starts folded away');
 D.querySelector('#bLeft').click();ok(w.getComputedStyle(D.querySelector('aside.left')).display!=='none','the Menu button opens it');
 D.querySelector('#topMan>summary').click();ok(D.querySelector('#topMan').open&&E('S.mode')==='dd','opening Manual control keeps Drag & draw');
 D.querySelector('#bLeft').click();ok(D.body.classList.contains('l-shut'),'and closes it again');
 const views=[...D.querySelectorAll('#tView option')].map(o=>o.value).join();ok(views==='dd,spec,compare','the View menu offers Drag & draw, Spec sheet and Compare ('+views+')');
 ok(!/jarod|porter/i.test(w.document.documentElement.innerHTML),'no Jarod / Porter text');
});

/* ---------- every library shape ---------- */
for(const name of LIBS)test(`Library shape loads, draws and exports: ${name}`,async({w,E,ok,finite})=>{
 E(`loadLib(${JSON.stringify(name)})`);await sleep(30);
 ok(E('S.meta.model')===name.toUpperCase()||E('S.meta.model')===name,'shape name filled in');
 ok(finite(),'outline and balance numbers are all finite');
 ok(E('S.p.swoopMode')==='one','opens as one swoop surface');
 ok(!Object.keys(E('S.curves')).some(k=>k==='smCup'||k==='bgCup'),'cups are a single radius (no traced cup curves)');
 for(const v of['design','sarado','spec','compare'])E(`setView('${v}');render();`);
 E(`S.page=2;render();S.page=1;setView('design');`);
 const pdf=E(`(()=>{const a=new PdfDrawer(612),b=new PdfDrawer(612);specPage1(a,CUR);specPage2(b,CUR);const d=buildPdf([a.o,b.o],792,612);return typeof d==='string'?d.length:(d.byteLength||d.length||0);})()`);
 ok(pdf>2000,'PDF builds ('+pdf+' bytes)');
 const got=E(`(()=>{const o=[],keep=download;download=(n,d)=>o.push([n,(d&&d.length)||0]);try{exportDxf();}finally{download=keep;}return o;})()`);
 ok(got.length===1&&/\.dxf$/i.test(got[0][0])&&got[0][1]>1000,'DXF exports');
 for(const part of['ken','sarado']){const n=E(`(()=>{$('#gPart').value='${part}';gStockDefault();const t=gcode();return t?t.length:0;})()`);ok(n>200,'G-code builds for the '+part);}
 for(const m of[['two',''],['one','radius'],['one','mirror']]){E(`S.p.swoopMode='${m[0]}';${m[1]?`S.p.swAMode='${m[1]}';`:''}refresh();`);ok(finite(),'swoop mode '+m.join(' ')+' builds');}
 E(`setTool('rot');render();`);ok(E('M3&&M3.q.length')>500,'3D model builds');E(`setTool('front');`);
});

test('Bird ridge steps drawn in the CAD are kept in the one-swoop view',async({E,ok})=>{
 E(`loadLib('P1')`);await sleep(30);
 const r=E(`(()=>{const G=CUR.G,o=G.p.sarL/2,e=LIB.find(q=>q.name==='P1'),at=u=>{let b=null;for(const q of G.sarPts){const d=Math.abs(q[0]+o-u);if(!b||d<b.d)b={d,r:q[1]};}return b.r;};
  let m=0;for(const[s,v]of G.sarPts){const u=s+o;if(Math.abs(u-11.67)<0.1||Math.abs(u-63.35)<0.1)continue;m=Math.max(m,Math.abs(v-interp(e.exact.sar,u)));}
  return{mode:S.p.swoopMode,sm:S.p.smStepH,bg:S.p.bgStepH,R:G.swoopR[0],smFoot:at(11.75),bgFoot:at(63.3),dev:m};})()`);
 ok(r.mode==='one','opens as one swoop surface');
 ok(Math.abs(r.sm-3.01)<0.05&&Math.abs(r.bg-3.24)<0.05,`steps found: small ${r.sm}, big ${r.bg} mm (drawing 2.99 / 3.24)`);
 ok(r.smFoot<21&&r.bgFoot<21.9,`swoop starts at the foot of each step (r ${r.smFoot.toFixed(2)} / ${r.bgFoot.toFixed(2)})`);
 ok(Math.abs(r.R-34.26)<0.1,`one swoop radius R${r.R.toFixed(2)} matches the drawing's R34.26`);
 ok(r.dev<0.05,`sarado outline within ${r.dev.toFixed(3)} mm of the CAD outline`);
 const none=E(`LIB.filter(e=>e.name!=='P1').filter(e=>{const p=libDesign(e).p;return p.smStepH>0.01||p.bgStepH>0.01;}).map(e=>e.name)`);
 ok(none.length===0,'shapes with rounded ridges get no step'+(none.length?': '+none.join(', '):''));
});

test('Hand-drawn in the measures panel opens Drag & draw on that contour',async({E,ok})=>{
 E(`loadLib('Kocho');setMode('manual');`);await sleep(30);
 E(`setDrawn('flare',true)`);await sleep(20);
 ok(E('S.mode')==='dd'&&E('S.view')==='design','Drag & draw opens');
 ok(E('DD.tool')==='draw'&&E('DD.focus')==='flare','Redraw is picked and the contour is highlighted');
 E(`setMode('manual');setDrawn('smCup',true)`);await sleep(20);
 ok(E('S.mode')==='dd'&&E('DD.tool')==='point'&&!E('DD.focus'),'a cup (set by its measures only) opens on Points');
});

test('Straight line tool makes the part between two clicks straight',async({E,ok,click,PP})=>{
 E(`loadLib('Kocho');setMode('dd');setDDTool('line');VT.design.auto=true;render();`);await sleep(30);
 const r=E(`(()=>{const sg=CUR.G.segs.flare;return{a:sg.s0+(sg.s1-sg.s0)*0.25,b:sg.s0+(sg.s1-sg.s0)*0.75};})()`);
 const at=s=>PP(E(`[ddRadAt(CUR.G.segs.flare,${s}),${s}]`));
 click(at(r.a));ok(E('DD.lA&&DD.lA.id')==='flare','first click marks one end');
 click(at(r.b));ok(!E('DD.lA')&&E('!!S.curves.flare'),'second click straightens the contour');
 const dev=E(`(()=>{const sg=CUR.G.segs.flare,a=${r.a},b=${r.b},va=ddRadAt(sg,a),vb=ddRadAt(sg,b);let m=0;for(let i=1;i<20;i++){const s=a+(b-a)*i/20;m=Math.max(m,Math.abs(ddRadAt(sg,s)-(va+(vb-va)*i/20)));}return m;})()`);
 ok(dev<0.02,`straight between the two points (within ${dev.toFixed(3)} mm)`);
 E(`setDDTool('line')`);const tb=E(`(()=>{const sg=CUR.G.segs.tamaBall;return sg?1:0;})()`);ok(tb===1,'tama contour exists for the next check');
 ok(!E(`ddLine('tamaBall',1,10)`),'the tama outside is not straightened');
});

test('Two points: Push / pull pulls the stretch about like a curve tool, keeping its shape; Smooth acts on it',async({E,ok,ev,PP})=>{
 E(`loadLib('Kocho');setMode('dd');setDDTool('push');DD.range=true;VT.design.auto=true;syncDD();render();`);await sleep(30);
 const r=E(`(()=>{const sg=CUR.G.segs.flare,sp=sg.s1-sg.s0;return{a:sg.s0+sp*0.2,b:sg.s0+sp*0.8,before:sg.out.map(q=>[q[0],q[1]])};})()`);
 const W=s=>E(`[ddRadAt(CUR.G.segs.flare,${s}),${s}]`),tap=w=>{const p=PP(w);ev('pointerdown',p[0],p[1]);ev('pointerup',p[0],p[1]);};
 tap(W(r.a));tap(W(r.b));ok(E('!!DD.rng&&DD.rng.id')==='flare','two clicks set the area');
 ok(/Two points/.test(E(`$('#ddOpts').textContent`))&&/Clear points/.test(E(`$('#ddOpts').textContent`)),'the dock shows the area and Clear points');
 const m=(r.a+r.b)/2,w0=W(m),p0=PP(w0),p1=PP([w0[0]+4,w0[1]]);ev('pointerdown',p0[0],p0[1]);for(let k=1;k<=5;k++)ev('pointermove',p0[0]+(p1[0]-p0[0])*k/5,p0[1]+(p1[1]-p0[1])*k/5);ev('pointerup',p1[0],p1[1]);
 const res=E(`(()=>{const o=CUR.G.segs.flare.out.map(q=>[q[0],q[1]]).sort((x,y)=>x[0]-y[0]),b=${JSON.stringify(r.before)}.sort((x,y)=>x[0]-y[0]),a=${r.a},bb=${r.b},off=DD.ctl.off;
  let worst=0;for(const u of[0.1,0.25,0.4,0.5,0.6,0.75,0.9]){const s=a+(bb-a)*u,got=interp(o,s)-interp(b,s),want=2*u*(1-u)*off[1];worst=Math.max(worst,Math.abs(got-want));}
  return{off,worst,out:Math.max(Math.abs(interp(o,a-2)-interp(b,a-2)),Math.abs(interp(o,bb+2)-interp(b,bb+2)))};})()`);
 ok(Math.abs(res.off[1]-4)<0.3&&Math.abs(res.off[0])<0.3,`the control point follows the pointer (${res.off[1].toFixed(2)} mm out)`);
 ok(res.worst<0.03,`the stretch keeps its shape: each spot moves by 2t(1-t) of the pull (off by at most ${res.worst.toFixed(3)} mm)`);
 ok(res.out<0.01,'unchanged outside the points');
 const o1=E('DD.ctl.off[1]');ev('pointerdown',p1[0],p1[1]);ev('pointermove',p1[0]+(p1[0]-p0[0])/4,p1[1]);ev('pointerup',p1[0]+(p1[0]-p0[0])/4,p1[1]);
 ok(E('DD.ctl.off[1]')>o1+0.5,'a second drag carries on from where the first left off');
 E(`setDDTool('smooth');DD.range=true;syncDD();`);ok(E('!!DD.rng')&&!E(`$('#ddOpts button:last-child').disabled`),'the area carries over to Smooth, and Smooth here is ready');
});

test('Mark-up tools open from the Drag & draw bar and draw over the shape',async({E,ok,ev,PP,fitView})=>{
 E(`loadLib('Kocho');setMode('dd');MK.items=[];setDDTool('mark');`);await sleep(30);fitView();
 const ids=E(`[...$('#ddOpts').querySelectorAll('button')].map(b=>b.dataset.t||b.dataset.a).join(',')`);
 ok(ids==='move,rot,spin,front,line,plane,circle,measure,pen,undo,redo,del,clear','the mark-up tools pop out above the bar ('+ids+')');
 E(`$('#ddOpts button[data-t=line]').click()`);ok(E('MK.tool')==='line','picking a mark-up tool');
 const a=PP([-30,40]),b=PP([10,80]);ev('pointerdown',a[0],a[1]);ev('pointermove',(a[0]+b[0])/2,(a[1]+b[1])/2);ev('pointermove',b[0],b[1]);ev('pointerup',b[0],b[1]);
 ok(E('MK.items.length')===1,'a line is drawn on the canvas');
 E(`$('#ddOpts button[data-t=rot]').click()`);ok(E('V3.on'),'3D turn is available');
 E(`setDDTool('push')`);ok(!E('V3.on'),'a shaping tool goes back to the flat view');
});

test('Sarado apart: off the ken, moved, turned, still shaped, and back',async({E,ok,drag,PP,fitView,finite})=>{
 E(`loadLib('Kocho');setMode('dd');`);await sleep(30);
 E(`ddSarToggle()`);await sleep(20);fitView();
 ok(E('sarApart()')&&E('DD.tool')==='free','taken off, with Move pieces picked');
 const c0=E('[DD.sar.C.x,DD.sar.C.y]');ok(c0[0]<-20,'starts beside the ken ('+c0[0].toFixed(1)+' mm)');
 const p=PP(E(`(()=>{const G=CUR.G;return sarW(0,3);})()`)),q=[p[0],p[1]+30];drag(p,q,6);
 const c1=E('[DD.sar.C.x,DD.sar.C.y]');ok(Math.abs(c1[1]-c0[1])>3,'dragging moves it');
 E(`DD.sar.a=Math.PI/4;render();`);
 const rt=E(`(()=>{const G=CUR.G,sg=G.segs.swoopAll,s=(sg.s0+sg.s1)/2,v=ddRadAt(sg,s),w=ddFrom(G,sg,s,v,1),b=ddTo(G,sg,w[0],w[1]);return Math.hypot(b[0]-s,b[1]-v);})()`);
 ok(rt<1e-6,'contour points map to and from the turned sarado');
 const h=E(`(()=>{const H=ddHandles();return{w:!!H.find(x=>x.id==='waist'&&x.loc),pos:!!H.find(x=>x.id==='sarPos')};})()`);ok(h.w&&!h.pos,'its points ride with it (no sarado-height point while apart)');
 const w0=E('S.p.waistD');E(`setDDTool('point')`);const wh=E(`(()=>{const x=ddHandles().find(q=>q.id==='waist');return[x.X,x.Y,x.loc.ey[0],x.loc.ey[1]];})()`);
 const a=PP([wh[0],wh[1]]),b=PP([wh[0]+wh[2]*1.5,wh[1]+wh[3]*1.5]);drag(a,b,5);ok(E('S.p.waistD')>w0+1,'dragging the waist point outward in the sarado frame widens the waist');
 ok(finite(),'outline and balance stay finite');
 const keep=E('JSON.stringify([DD.sar.C,DD.sar.a])');E(`ddSarToggle()`);ok(!E('sarApart()'),'back on the ken');
 E(`ddSarToggle()`);ok(E('JSON.stringify([DD.sar.C,DD.sar.a])')===keep,'taken off again, it comes back to the same place');
 E(`ddSarToggle()`);
});

test('Compare tool: add shapes, show / hide, move, turn and remove each one',async({E,ok,ev,PP,fitView})=>{
 E(`loadLib('Kocho');setMode('dd');setDDTool('cmp');`);await sleep(30);
 ok(!E(`!!document.querySelector('#cmpLib')`),'the side-panel library menu is gone');
 E(`[...$('#ddOpts').querySelectorAll('button')].find(b=>b.textContent==='Add a shape').click()`);
 ok(E(`$('#ddOpts .dd-list').querySelectorAll('button').length`)>=10,'the list holds every library shape');
 E(`[...$('#ddOpts .dd-list').querySelectorAll('button')].find(b=>b.textContent==='Gyro').click()`);
 ok(E('S.ovl.length')===1&&E('S.ovl[0].name')==='Gyro','Gyro added');
 ok(E(`$('#ddOpts').querySelectorAll('.dd-chip').length`)===1&&!!E(`!!$('#ddOpts .dd-pop')`),'it gets a button, and its controls pop out');
 fitView();const a=PP([0,30]),b=PP([20,30]);ev('pointerdown',a[0],a[1]);ev('pointermove',(a[0]+b[0])/2,a[1]);ev('pointermove',b[0],b[1]);ev('pointerup',b[0],b[1]);
 ok(Math.abs(E('S.ovl[0].x')-20)<0.5,'dragging its outline moves it');
 E(`[...$('#ddOpts .dd-pop').querySelectorAll('button')].find(b=>b.textContent==='+').click()`);ok(Math.round(E('S.ovl[0].a')*180/Math.PI)===5,'turn + turns it 5°');
 E(`$('#ddOpts .dd-pop [data-k=eye]').click()`);ok(E('S.ovl[0].on')===false,'hide');
 ok(E('projectData().ovl.length')===1,'kept with the project');
 ok(E(`[...$('#ddOpts .dd-pop').children].map(b=>b.dataset.k||(b.classList.contains('dd-st')?'turn':'name')).join(',')`)==='name,eye,reset,remove,turn','its toolbar is name, eye, reset place, bin, turn');
 ok(!/Drag its outline/.test(E(`$('#ddOpts').textContent`)),'no drag hint text');
 E(`$('#ddOpts [data-k=outline]').click()`);ok(E('DD.outline')&&E(`$('#ddOpts [data-k=outline]').textContent.trim()`)==='','an icon button turns this design into an outline');
 E(`DD.outline=false;syncDD();`);
 E(`$('#ddOpts .dd-pop [data-k=remove]').click()`);ok(E('S.ovl.length')===0,'remove');
});

test('Sarado apart: every piece still bumps into the others',async({E,ok})=>{
 E(`loadLib('Kocho');setMode('dd');ddSarToggle();`);await sleep(20);
 const r=E(`(()=>{const f=ddFree(),o={};const x0=DD.sar.C.x;ddSarMove(80,0);o.sarMoved=DD.sar.C.x-x0;o.sarClear=!sarKenHit(DD.sar);const x1=DD.sar.C.x;ddSarMove(0.5,0);o.stuck=Math.abs(DD.sar.C.x-x1)<0.01;
  ddSarMove(-60,0);f.C={x:DD.sar.C.x,y:DD.sar.C.y+80};const y0=f.C.y;ddTamaMove(0,-80);o.tamaMoved=y0-f.C.y;o.tamaTouch=ddFreeHit({x:f.C.x,y:f.C.y-0.6},f.u);o.tamaClear=!ddFreeHit(f.C,f.u);return o;})()`);
 ok(r.sarMoved>5&&r.sarMoved<79&&r.sarClear&&r.stuck,`the sarado stops against the ken (moved ${r.sarMoved.toFixed(1)} of 80 mm)`);
 ok(r.tamaMoved>5&&r.tamaMoved<79&&r.tamaTouch&&r.tamaClear,`the tama stops against the sarado (moved ${r.tamaMoved.toFixed(1)} of 80 mm)`);
 const k=E(`(()=>{const f=ddFree();ddSarMove(30,0);f.C={x:200,y:300};const k=ddKenMove(-400*VT.design.z,0);return{k,touch:sarKenHit({C:{x:DD.sar.C.x+0.5,y:DD.sar.C.y},a:DD.sar.a})};})()`);
 ok(k.k<1&&k.touch,'moving the ken stops against the sarado');
 E(`ddSarToggle()`);
});

test('Measurements are mark-ups: they stay until selected and deleted',async({E,ok,click,ev,PP,fitView})=>{
 E(`loadLib('Kocho');setMode('dd');MK.items=[];setDDTool('mark');setTool('measure');`);await sleep(30);fitView();
 click(PP(E('[CUR.G.p.baseD/2,0]')));ok(!!E('MK.mA'),'first click marks one end');click(PP(E('[CUR.G.p.ringD/2,CUR.G.p.ringPos]')));
 ok(E('MK.items.length')===1&&E('MK.items[0].type')==='meas'&&!E('MK.mA'),'second click makes a measurement');
 ok(/mm/.test(E(`$('#ddOpts').textContent`)),'the dock shows its length');
 const a=PP([-20,40]),b=PP([0,80]);ev('pointerdown',a[0],a[1]);ev('pointermove',(a[0]+b[0])/2,(a[1]+b[1])/2);ev('pointermove',b[0],b[1]);ev('pointerup',b[0],b[1]);ok(E('MK.items.length')===2,'dragging makes one too');
 E(`setDDTool('push');setDDTool('point');`);ok(E('MK.items.length')===2,'they stay when the tool changes');
 E(`setDDTool('mark');MK.sel=0;mkAct('del');`);ok(E('MK.items.length')===1,'a selected one is deleted with the mark-up delete');
 ok(!E(`!!document.querySelector('#dd button[data-d=measure]')`),'Measure is no longer on the main bar');
 E(`MK.items=[];setDDTool('point');`);
});

test('Restore goes back to the contours as they were when the design was opened',async({E,ok})=>{
 E(`loadLib('Kocho');setMode('dd');`);await sleep(30);

test('Redraw follows the drawn line: far from the old contour, ends off it, zoomed in, and a second stroke leaves the first alone',async({E,ok,ev,fitView})=>{

 const base=E('snapState()'),load=()=>E(`(()=>{const o=JSON.parse(${JSON.stringify(base)});S.p=o.p;S.curves=o.curves;refresh();})()`);
 // zoom in on a contour, draw a line offset from it by off(t) mm between fractions a..b, and return how far (mm) the new contour lies from that line
 E(`window.__zoom=(id,z)=>{const T=VT.design,G=CUR.G,sg=G.segs[id],m=sg.out[sg.out.length>>1],w=ddFrom(G,sg,m[0],m[1],1);T.auto=false;T.z=z;T.ox=CW/2-w[0]*z;T.oy=CH/2+w[1]*z;render();};
  window.__line=(id,off,a,b)=>{const G=CUR.G,sg=G.segs[id],n=sg.out.length,i0=Math.round(n*a),i1=Math.round(n*b),o=[];for(let i=i0;i<=i1;i++){const q=sg.out[i];o.push(ddFrom(G,sg,q[0],q[1]+off((i-i0)/(i1-i0)),1));}return o;};
  window.__miss=(id,line)=>{const G=CUR.G,sg=G.segs[id],P=sg.out.map(q=>ddFrom(G,sg,q[0],q[1],1)),d=w=>{let m=1e9;for(let i=0;i<P.length-1;i++){const a=P[i],b=P[i+1],vx=b[0]-a[0],vy=b[1]-a[1],L=vx*vx+vy*vy||1e-9,t=Math.max(0,Math.min(1,((w[0]-a[0])*vx+(w[1]-a[1])*vy)/L));m=Math.min(m,Math.hypot(w[0]-a[0]-t*vx,w[1]-a[1]-t*vy));}return m;};const k=Math.round(line.length*0.05);return Math.max(...line.slice(k,line.length-k).map(d));};`);
 const draw=line=>{const px=line.map(w=>E(`[sx(VT.design,${w[0]}),sy(VT.design,${w[1]})]`)),st=[px[0]];for(const q of px){const l=st[st.length-1];if(Math.hypot(q[0]-l[0],q[1]-l[1])>2)st.push(q);}st.push(px[px.length-1]);
  ev('pointerdown',st[0][0],st[0][1]);st.forEach(q=>ev('pointermove',q[0],q[1]));ev('pointerup',st[st.length-1][0],st[st.length-1][1]);};
 ok(E('DD.smooth')===0,'line smoothing starts off, so the line is kept as drawn');
 const cases=[['swoopAll','8*Math.sin(t*Math.PI)',0.35,0.65,'8 mm out from the sarado swoop'],['swoopAll','1.5*Math.sin(t*Math.PI*3)',0.35,0.65,'a wiggle on the sarado swoop'],['swoopAll','1.5+0.5*Math.sin(t*Math.PI*2)',0.35,0.65,'ends 1.5 mm off the sarado swoop'],['flare','5*Math.sin(t*Math.PI)',0.25,0.75,'5 mm out from the flare'],['tamaBall','8*Math.sin(t*Math.PI)',0.3,0.7,'8 mm out from the tama']];
 for(const[id,f,a,b,what]of cases){load();E(`__zoom('${id}',5);setDDTool('draw');`);const line=E(`__line('${id}',t=>${f},${a},${b})`);draw(line);const m=E(`__miss('${id}',${JSON.stringify(line)})`);ok(m<0.15,`zoomed in, ${what}: the contour follows the line (off by ${m.toFixed(3)} mm at most)`);}
 // a second stroke further along leaves the first one as it was
 load();E(`__zoom('swoopAll',3);setDDTool('draw');`);const l1=E(`__line('swoopAll',t=>2*Math.sin(t*Math.PI),0.15,0.4)`);draw(l1);const m1=E(`__miss('swoopAll',${JSON.stringify(l1)})`);
 const l2=E(`__line('swoopAll',t=>-1.5*Math.sin(t*Math.PI),0.6,0.85)`);draw(l2);const m2=E(`__miss('swoopAll',${JSON.stringify(l1)})`);
 ok(m1<0.15&&Math.abs(m2-m1)<0.01,`a second stroke does not blur the first (${m1.toFixed(3)} → ${m2.toFixed(3)} mm)`);
 // with line smoothing on, the new part is smoothed
 load();E(`__zoom('swoopAll',5);setDDTool('draw');DD.smooth=2;`);const lw=E(`__line('swoopAll',t=>1.5*Math.sin(t*Math.PI*3),0.35,0.65)`);draw(lw);ok(E(`__miss('swoopAll',${JSON.stringify(lw)})`)>0.2,'with line smoothing on, the drawn wiggle is evened out');
 E('DD.smooth=0;VT.design.auto=true;');load();
});

const frame=document.getElementById('app'),out=document.getElementById('out'),sum=document.getElementById('sum');
function loadApp(width,height){return new Promise((res,rej)=>{frame.width=width||1280;frame.height=height||820;const t=setTimeout(()=>rej(new Error('app did not load')),15000);frame.onload=()=>{clearTimeout(t);res(frame.contentWindow);};frame.src='index.html?selftest='+Date.now();});}
async function runAll(){
 out.innerHTML='';sum.className='';sum.textContent='Running…';
 const saved={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);saved[k]=localStorage.getItem(k);}}catch(e){}
 // tests.html?only=tama|stall runs just the tests whose names match; ?skip=every%20contour leaves those out
 const qs=new URLSearchParams(location.search),only=qs.get('only')&&new RegExp(qs.get('only'),'i'),skip=qs.get('skip')&&new RegExp(qs.get('skip'),'i'),LIST=TESTS.filter(T=>(!only||only.test(T.name))&&!(skip&&skip.test(T.name)));
 let pass=0,fail=0;const t0=performance.now();
 for(const T of LIST){
  const row=document.createElement('div');row.className='t';row.innerHTML='<span class="s">…</span><b></b>';row.querySelector('b').textContent=T.name;out.append(row);
  const fails=[];let checks=0;const errs=[];const s0=performance.now();
  try{
   try{localStorage.removeItem('ksd.autosave');localStorage.setItem('tse.lang','en');localStorage.setItem('tse.right','1');}catch(e){}
   const w=await loadApp(T.opt.width,T.opt.height);w.addEventListener('error',e=>errs.push(e.message));await sleep(60);
   const ok=(c,m)=>{checks++;if(!c)fails.push(m);};
   await T.fn(Object.assign({w,ok},helpers(w)));await sleep(20);
  }catch(e){fails.push('threw: '+(e&&e.message||e));}
  for(const e of errs)fails.push('error in the app: '+e);
  const good=!fails.length;good?pass++:fail++;row.className='t '+(good?'ok':'bad');row.querySelector('.s').textContent=good?'pass':'FAIL';
  const sm=document.createElement('small');sm.textContent=`  ${checks} checks, ${Math.round(performance.now()-s0)} ms`;row.append(sm);
  if(!good){const ul=document.createElement('ul');for(const f of fails.slice(0,12)){const li=document.createElement('li');li.textContent=f;ul.append(li);}row.append(ul);}
  sum.textContent=`Running… ${pass+fail} / ${LIST.length}`;
 }
 try{localStorage.clear();for(const k in saved)localStorage.setItem(k,saved[k]);}catch(e){}
 frame.src='about:blank';
 sum.className=fail?'bad':'ok';sum.textContent=`${pass} passed, ${fail} failed, in ${((performance.now()-t0)/1000).toFixed(1)} s`+(LIST.length<TESTS.length?` (${TESTS.length-LIST.length} of ${TESTS.length} tests left out by the filter)`:'');
 window.RESULT={pass,fail,total:LIST.length,failed:[...out.querySelectorAll('.t.bad')].map(r=>r.innerText)};
}
document.getElementById('run').onclick=runAll;runAll();
</script>
